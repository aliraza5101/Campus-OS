<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" fill="none" className="w-full h-full">
  <defs>
    <!-- Navy Mortarboard Cap Gradient -->
    <linearGradient id="capGradExact" x1="55" y1="45" x2="445" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1336" />
      <stop offset="50%" stop-color="#121D50" />
      <stop offset="100%" stop-color="#0B1336" />
    </linearGradient>

    <!-- Top Arc Royal Blue Gradient -->
    <linearGradient id="topArcGradExact" x1="115" y1="120" x2="380" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#0077FF" />
      <stop offset="85%" stop-color="#223FC8" />
      <stop offset="100%" stop-color="#2E30A8" />
    </linearGradient>

    <!-- Inner 3D Depth Under-Layer -->
    <linearGradient id="cInnerDepthExact" x1="180" y1="200" x2="330" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101642" />
      <stop offset="100%" stop-color="#1E2568" />
    </linearGradient>

    <!-- Lower Chevron Teal-Emerald to Blue Gradient -->
    <linearGradient id="bottomChevronGradExact" x1="110" y1="330" x2="380" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="40%" stop-color="#0084FF" />
      <stop offset="75%" stop-color="#00C9A7" />
      <stop offset="100%" stop-color="#2CE88E" />
    </linearGradient>

    <!-- Circuit Traces Gradient -->
    <linearGradient id="circuitGradExact" x1="50" y1="230" x2="180" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Subtle Shadow for Emblem -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1A237E" flood-opacity="0.12" />
    </filter>
  </defs>

  <g id="brand-emblem" filter="url(#subtleGlow)">
    <!-- 1. TOP NAVY GRADUATION CAP (Mortarboard Diamond) -->
    <polygon
      points="250,42 445,142 250,222 55,142"
      fill="url(#capGradExact)"
    />

    <!-- Tassel on Right Side -->
    <path
      d="M 422,152 Q 430,195 422,230"
      stroke="#0B1336"
      stroke-width="4"
      fill="none"
      stroke-linecap="round"
    />
    <circle cx="422" cy="232" r="4.5" fill="#121D50" />
    <path
      d="M 422,232 C 414,240 410,256 408,288 C 420,292 426,292 438,288 C 435,256 430,240 422,232 Z"
      fill="#0B1336"
    />

    <!-- 2. UPPER 'C' ARCH (Royal Blue Hexagon Ribbon) -->
    <path
      d="M 115,240 
         L 248,118 
         L 376,230 
         L 326,268 
         L 248,198 
         L 172,268 
         Z"
      fill="url(#topArcGradExact)"
    />

    <!-- 3D Under-Facet / Bevel for Upper Arch -->
    <path
      d="M 172,268 
         L 248,198 
         L 326,268 
         L 306,288 
         L 248,236 
         L 190,288 
         Z"
      fill="url(#cInnerDepthExact)"
    />

    <!-- 3. CIRCUIT TRACES & NODES (LEFT SIDE) -->
    <!-- Top Circuit Trace -->
    <path
      d="M 65,235 L 115,235 Q 138,235 152,270 L 175,270"
      stroke="url(#circuitGradExact)"
      stroke-width="13"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="65" cy="235" r="16" fill="white" stroke="#00D2FF" stroke-width="8" />

    <!-- Middle Circuit Trace -->
    <path
      d="M 55,305 L 140,305"
      stroke="url(#circuitGradExact)"
      stroke-width="13"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="55" cy="305" r="16" fill="white" stroke="#00A3FF" stroke-width="8" />

    <!-- Bottom Circuit Trace -->
    <path
      d="M 68,375 L 115,375 Q 138,375 152,340 L 175,340"
      stroke="url(#circuitGradExact)"
      stroke-width="13"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="68" cy="375" r="16" fill="white" stroke="#0072FF" stroke-width="8" />

    <!-- 4. LOWER 'C' CHEVRON (Turquoise / Emerald Gradient) -->
    <path
      d="M 112,375 
         L 248,485 
         L 376,330 
         L 328,298 
         L 248,368 
         L 172,298 
         Z"
      fill="url(#bottomChevronGradExact)"
    />

    <!-- Crisp White Accent Stripe Inside Chevron Crease -->
    <polyline
      points="165,335 248,408 335,342"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- BRAND TYPOGRAPHY: Exact match to uploaded image -->
  <!-- "CampusOS" Title -->
  <text
    x="250"
    y="545"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="56"
    letter-spacing="-0.025em"
  >
    <tspan fill="#0B1336">Campus</tspan>
    <tspan fill="url(#bottomChevronGradExact)">OS</tspan>
  </text>

  <!-- Tagline Divider Lines & Text: "YOUR CAMPUS. YOUR ROADMAP. YOUR FUTURE." -->
  <line x1="30" y1="584" x2="68" y2="584" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
  <text
    x="250"
    y="588"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="12.5"
    letter-spacing="0.18em"
    fill="#1E293B"
  >YOUR CAMPUS. YOUR ROADMAP. YOUR FUTURE.</text>
  <line x1="432" y1="584" x2="470" y2="584" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
</svg>
